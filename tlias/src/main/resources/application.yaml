spring:
  application:
    name: tlias
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tlias
    username: root
    password: "000"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true   # 开启驼峰映射，让 create_time 自动映射为 createTime

pagehelper:
  reasonable: true          # 页码合理化：page<=0查第一页，page>总页数查最后一页
  helper-dialect: mysql